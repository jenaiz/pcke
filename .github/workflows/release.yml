name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # publish releases
  id-token: write   # cosign keyless OIDC
  packages: write   # future: container images

jobs:
  goreleaser:
    name: goreleaser + cosign keyless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cosign keyless OIDC — no key material required.
          COSIGN_EXPERIMENTAL: "1"

# goreleaser config.
# Targets: darwin/linux × amd64/arm64.
# Windows is built in CI as a smoke test but NOT shipped here yet.
#
# Compatible with goreleaser v2.

version: 2

project_name: pcke

before:
  hooks:
    - go mod tidy

builds:
  - id: pcke
    main: ./cmd/pcke
    binary: pcke
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: pcke
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

# Cosign keyless signing of checksums + binaries (B9).
# Active when running inside GitHub Actions with OIDC.
# Locally (snapshot), the signs section is skipped automatically because
# COSIGN_EXPERIMENTAL is unset and signing requires the OIDC issuer.
signs:
  - id: cosign
    cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

homebrew_casks:
  - repository:
      owner: jenaiz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/jenaiz/pcke
    description: "Project Context & Knowledge Engine — long-term engineering memory for AI agents"
    binaries:
      - pcke
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pcke"]
          end
